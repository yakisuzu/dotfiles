# dotfilesで管理する個人用profile

personality = "pragmatic"

notify = ["bash", "-lc", "[ \\\"${CODEX_SAY_ENABLED:-}\\\" = true ] || exit 0; msg=$(jq -r '.\\\"last-assistant-message\\\" \\/\\/ empty' <<< \\\"$1\\\"); [ -n \\\"$msg\\\" ] && say \\\"$msg\\\"", "codex-notify"]
model = "gpt-5.6-luna"
model_reasoning_effort = "medium"

[tui]
alternate_screen = "never"

[tui.model_availability_nux]
"gpt-5.5" = 1
"gpt-6.1-sol" = 4
